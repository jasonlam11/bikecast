[project]
name = "bikecast"
version = "0.1.0"
description = "Day-ahead hourly demand forecasting for Boston Bluebikes stations"
authors = [
    { name = "Jason Lam", email = "jasonlam276@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "duckdb>=1.5.6",
    "holidays>=0.106",
    "matplotlib>=3.11.2",
    "pandas>=3.0.6",
    "pyarrow>=25.0.1",
    "requests>=2.34.2",
]

[build-system]
requires = ["uv_build>=0.12.24,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "ipykernel>=7.4.0",
    "jupyter>=1.1.1",
    "nbconvert>=7.17.1",
    "pytest>=9.1.1",
    "ruff>=0.16.10",
]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-include = ["*.ipynb"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "PD"]
# groupby().unstack() is idiomatic pandas
ignore = ["PD010"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
